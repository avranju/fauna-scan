[package]
name = "fauna-scan"
version = "0.1.0"
description = "Discover Hikvision NVR images and classify wildlife with OpenAI-compatible vision APIs"
license = "MIT"
repository = "https://github.com/avranju/fauna-scan"
homepage = "https://github.com/avranju/fauna-scan"
readme = "README.md"
keywords = ["wildlife", "hikvision", "nvr", "computer-vision", "camera"]
categories = ["command-line-utilities", "multimedia::images"]
edition = "2024"
rust-version = "1.97"
default-run = "fauna-scan"

[[bin]]
name = "fauna-scan"
path = "src/main.rs"

[[bin]]
name = "sqlite-to-pg"
path = "sqlite-to-pg/main.rs"

[[test]]
name = "test_relative_output_root"
path = "tests/test_relative_output_root.rs"
harness = false

[lib]
name = "fauna_scan"
path = "src/lib.rs"

[features]
default = ["sqlite", "postgres"]
sqlite = []
postgres = ["sqlx/postgres"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "runtime-tokio", "sqlite", "migrate", "macros"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
nix = { version = "0.31.3", default-features = false, features = ["fs", "signal", "process"] }
bytes = "1.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli"] }
digest_auth = "0.3.1"
md-5 = "0.11.0"
sha2 = "0.11.0"
uuid = { version = "1.27.0", features = ["v4"] }
quick-xml = "0.42.0"
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs"] }
base64 = "0.23.1"
serde_json = "1.0.151"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
axum = "0.8.9"
futures-util = "0.3.34"
tempfile = "3.27.0"
tower-http = { version = "0.7.1", features = ["compression-gzip", "trace"] }

[dev-dependencies]
assert_cmd = "2.2.2"
futures = "0.3.34"
http = "1.5.0"
predicates = "3.1.4"
rcgen = "0.14.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1.53.2", features = ["full", "test-util"] }
tokio-rustls = "0.26.6"
wiremock = "0.6.5"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
