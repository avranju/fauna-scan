# Fauna Scan example configuration. Replace every /home/user path and create
# the referenced secret files before running `fauna-scan check-config`.
# For each secret, use exactly one of literal, *_file, or *_env; file-backed
# secrets are recommended for production and must never be committed.

[database]
backend = "sqlite"
path = "/home/user/.local/state/fauna-scan/fauna-scan.sqlite3"
max_connections = 8

[general]
output_directory = "/home/user/Pictures/fauna-scan"
log_level = "info"
# Number of days to retain images classified as not containing wildlife.
# Images older than this (measured from capture time) and classified as
# no-wildlife will be garbage collected. Images with any wildlife-positive
# classification are never collected.
non_wildlife_image_retention_days = 4

[web]
enabled = true
listen_address = "127.0.0.1:8787"
clip_pre_roll_seconds = 10
clip_post_roll_seconds = 20
maximum_clip_duration_seconds = 120
# Recording playback uses RTSP, independently of [nvr].port (ISAPI HTTP).
rtsp_port = 554
clips_enabled = true
ffmpeg_path = "ffmpeg"
max_concurrent_clip_encodes = 1
# Color is #RRGGBB; width is in pixels of the original image.
bounding_box_color = "#FFFF00"
bounding_box_width_pixels = 3
# At most this many annotated JPEGs are decoded and encoded at once.
max_concurrent_bounding_box_renders = 2

[nvr]
scheme = "http"
host = "nvr.example.invalid"
port = 8080
username = "admin"
password_file = "/home/user/.config/fauna-scan/nvr-password"
# password, password_file, and password_env are mutually exclusive.
start_at = "2026-07-11T00:00:00+05:30"
request_timeout_seconds = 30
connect_timeout_seconds = 10
allow_invalid_tls_certificates = false

[nvr.search]
window_minutes = 60
max_results = 50
poll_interval_seconds = 60
poll_overlap_seconds = 120
camera_refresh_interval_seconds = 3600
settlement_delay_seconds = 10

# Optional daily capture-time filter. Times are evaluated against the NVR's
# clock using this fixed UTC offset; start is inclusive and end is exclusive.
# A start later than end crosses midnight (for example, 19:00 to 07:00).
# [nvr.search.capture_time_window]
# start_time = "19:00"
# end_time = "07:00"
# utc_offset = "+05:30"

[nvr.download]
retry_limit = 10
retry_initial_delay_seconds = 5
retry_max_delay_seconds = 300
maximum_image_size_bytes = 25000000
verify_jpeg = true
rebase_playback_urls = true
concurrency = 2
# Only needed when rebase_playback_urls = false.
playback_host_allowlist = []

[classifier]
poll_interval_seconds = 10
retry_limit = 5
retry_initial_delay_seconds = 10
retry_max_delay_seconds = 300
processing_lease_seconds = 600

# Each endpoint gets one concurrent classifier worker.
[[classifier.endpoints]]
# Set to false to keep an endpoint configured but remove it from request rotation.
enabled = true
base_url = "http://localhost:8081/v1"
endpoint = "/chat/completions"
model = "vision-model"
api_key_file = "/home/user/.config/fauna-scan/classifier-api-key"
# api_key, api_key_file, and api_key_env are mutually exclusive.
username = ""
# Set password_file (or password/password_env) only when Basic authentication is used.
request_timeout_seconds = 120
prompt_version = "wildlife-v2"

[classifier.endpoints.generation]
temperature = 0.1
max_tokens = 1000

# Optional provider quota policy. Endpoints using the same provider account
# and model must use the same quota_group and identical values.
# [classifier.endpoints.rate_limit]
# quota_group = "provider-account-vision-model"
# requests_per_minute = 5
# requests_per_day = 2400
# tokens_per_minute = 30000
# tokens_per_day = 1000000
# estimated_input_tokens_per_request = 4096
# max_images_per_request = 10

