[package]
name = "fauna-scan"
version = "0.1.0"
edition = "2024"
default-run = "fauna-scan"

[[bin]]
name = "fauna-scan"
path = "src/main.rs"

[[bin]]
name = "sqlite-to-pg"
path = "sqlite-to-pg/main.rs"

[[test]]
name = "test_relative_output_root"
path = "tests/test_relative_output_root.rs"
harness = false

[lib]
name = "fauna_scan"
path = "src/lib.rs"

[features]
default = ["sqlite", "postgres"]
sqlite = []
postgres = ["sqlx/postgres"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["chrono", "runtime-tokio", "sqlite", "migrate", "macros"] }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
nix = { version = "0.30", default-features = false, features = ["fs", "signal", "process"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli"] }
digest_auth = "0.3"
md-5 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.37"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
base64 = "0.22"
serde_json = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }

[dev-dependencies]
assert_cmd = "2"
futures = "0.3"
http = "1"
predicates = "3"
rcgen = "0.14"
tempfile = "3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-rustls = "0.26"
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
