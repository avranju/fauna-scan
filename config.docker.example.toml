# Copy this file to config.toml beside docker-compose.yml and replace the
# NVR/classifier placeholders. Secret paths refer to Compose-managed secrets.

[general]
database_path = "/var/lib/fauna-scan/fauna-scan.sqlite3"
output_directory = "/var/lib/fauna-scan/images"
log_level = "info"

[web]
enabled = true
listen_address = "0.0.0.0:8787"
clip_pre_roll_seconds = 10
clip_post_roll_seconds = 20
maximum_clip_duration_seconds = 120

[nvr]
scheme = "http"
host = "pigate"
port = 8080
username = "admin"
password_file = "/run/secrets/nvr_password"
start_at = "2026-07-11T00:00:00+05:30"
request_timeout_seconds = 30
connect_timeout_seconds = 10
allow_invalid_tls_certificates = false

[nvr.search]
window_minutes = 60
max_results = 50
poll_interval_seconds = 60
poll_overlap_seconds = 120
camera_refresh_interval_seconds = 3600
settlement_delay_seconds = 10

[nvr.download]
retry_limit = 10
retry_initial_delay_seconds = 5
retry_max_delay_seconds = 300
maximum_image_size_bytes = 25000000
verify_jpeg = true
rebase_playback_urls = true
concurrency = 2
playback_host_allowlist = []

[classifier]
poll_interval_seconds = 10
retry_limit = 5
retry_initial_delay_seconds = 10
retry_max_delay_seconds = 300
processing_lease_seconds = 600

[[classifier.endpoints]]
base_url = "http://classifier:8081/v1"
endpoint = "/chat/completions"
model = "vision-model"
api_key_file = "/run/secrets/classifier_api_key"
username = ""
request_timeout_seconds = 120
prompt_version = "wildlife-v1"

[classifier.endpoints.generation]
temperature = 0.1
max_tokens = 1000

